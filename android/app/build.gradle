plugins {
    id 'com.android.application'
}

// The signing key is not in the repository. Put its location and the
// passwords in android/local.properties, which is not tracked, or set the
// same names in the environment.
def signingProps = new Properties()
def signingPropsFile = rootProject.file("local.properties")
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}
["PDA_STORE_FILE", "PDA_STORE_PASSWORD", "PDA_KEY_ALIAS", "PDA_KEY_PASSWORD"].each { key ->
    if (System.getenv(key)) {
        signingProps.setProperty(key, System.getenv(key))
    }
}
def haveSigningKey = signingProps["PDA_STORE_FILE"] != null

android {
    namespace "org.sdl2.perfectdark"
    compileSdk 34

    defaultConfig {
        applicationId "org.sdl2.perfectdark"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "org.sdl2.perfectdark.ModTestRunner"

        // Perfect Dark requires a gamepad-capable device; keep requirements minimal.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
            // Local emulator builds only; normal APKs retain the two ARM ABIs.
            if (project.hasProperty('emulatorAbi')) {
                abiFilters.clear()
                abiFilters project.property('emulatorAbi')
            }
        }
    }

    signingConfigs {
        debug {
            // Debug keystore is generated automatically by the Android Gradle Plugin.
        }
        release {
            if (haveSigningKey) {
                storeFile file(signingProps["PDA_STORE_FILE"])
                storePassword signingProps["PDA_STORE_PASSWORD"]
                keyAlias signingProps["PDA_KEY_ALIAS"]
                keyPassword signingProps["PDA_KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (haveSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // The native libraries are built by the CMakeLists.txt in the
            // repository root and copied into src/main/jniLibs, where the
            // Android Gradle Plugin packages them into the APK.
        }
    }
}

// Both the launcher and SDL use platform Activities; no AndroidX UI runtime
// is needed for the folder picker or mod import.
