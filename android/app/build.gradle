plugins {
    id 'com.android.application'
}

android {
    namespace "org.sdl2.perfectdark"
    compileSdk 34

    defaultConfig {
        applicationId "org.sdl2.perfectdark"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Perfect Dark requires a gamepad-capable device; keep requirements minimal.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        debug {
            // Debug keystore is generated automatically by the Android Gradle Plugin.
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO: configure a release signingConfig before building a release APK.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // The native libraries are built by the CMakeLists.txt in the
            // repository root and copied into src/main/jniLibs, where the
            // Android Gradle Plugin packages them into the APK.
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
